[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-disclosure-gateway"
version = "0.1.0"
description = "Research prototype for policy-constrained disclosure to external LLMs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
adg = "adaptive_disclosure_gateway.cli:main"

[project.optional-dependencies]
documents = [
  "docling",
]
api = [
  "fastapi>=0.115,<1",
  # Required by the multipart/form-data upload routes (POST /documents/*).
  # FastAPI raises at import time for a route declaring File()/Form() if it
  # is missing, so it belongs with fastapi rather than with `documents`.
  "python-multipart>=0.0.9,<0.1",
  "uvicorn>=0.30,<1",
]
# T22 / issue #30 -- the real provider adapter. Deliberately optional, like
# `documents`: the deterministic FakeProvider stays the default everywhere,
# so the baseline dev/test/CI environment never needs this installed, and
# `tests/test_providers_anthropic.py` exercises every adapter path offline
# without it. Bounded pin: `anthropic` 1.x is built on httpx2 and a 2.x
# would be a transport/API break, not a drop-in upgrade.
anthropic = [
  "anthropic>=1,<2",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "python-multipart>=0.0.9,<0.1",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
