[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-disclosure-gateway"
version = "0.1.0"
description = "Research prototype for policy-constrained disclosure to external LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
