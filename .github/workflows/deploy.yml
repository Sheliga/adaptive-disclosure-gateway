name: deploy

# Rolls out the images `publish-images.yml` just built and pushed to GHCR on
# the Hostinger VPS (srv1994437.hstgr.cloud), by resubmitting the
# `disclosure-gateway` Docker Manager project through the Hostinger API's
# "Create new project" endpoint (POST .../virtual-machines/{id}/docker).
#
# WHY CREATE (REPLACE), NEVER `.../docker/{project}/update`: `update` only
# re-pulls whatever image tags the CURRENTLY STORED project compose already
# references. This project is deliberately pinned to an explicit commit SHA
# (compose.prod.yaml's `ADG_IMAGE_TAG`, never `:latest`), so calling
# `update` after a new image lands would just re-pull the SAME,
# already-running SHA -- a silent no-op that looks like a successful
# deploy. Only resubmitting the whole project (new `content` +new
# `environment` with the new `ADG_IMAGE_TAG`) actually changes what runs.
# The Hostinger API documents this replace-on-create behavior explicitly:
# "If project with the same name already exists, existing project will be
# replaced." This is the central design decision in this file.
#
# CONSEQUENCE OF REPLACE: recreating the project recreates both containers,
# so there is a short availability gap -- roughly the ~120s healthcheck
# start_period plus however long the ~2.6 GB api image takes to pull, on
# top of teardown of the old containers -- between the old project going
# away and the new one reporting healthy. Accepted for now: a single
# 1-vCPU VPS has no blue/green or rolling-update mechanism to fall back on.
#
# ROLLBACK: re-run this workflow manually (workflow_dispatch) with `sha` set
# to any commit SHA `publish-images.yml` has already pushed to GHCR (i.e.
# any prior master commit). Omit it to redeploy the current master commit
# as-is (e.g. to recover from a Hostinger-side failure without a new push).
#
# NOT SSH-based on purpose: the VPS's `disclosure-gateway` project is a
# Docker Manager project (visible/editable in the Hostinger panel); driving
# it through the same API the panel uses keeps that single source of truth,
# rather than a parallel `ssh`+`docker compose` path the panel doesn't know
# about and that would drift from what the UI shows.
#
# INCIDENT (run 35585709567): the first real automated deploy authenticated,
# resolved the VM and reached the create/replace call, then got
# HTTP 422 {"message":"The content field must not be greater than 8192
# characters.", ...} for compose.prod.yaml's full ~9020-byte content. That
# limit is undocumented in the Hostinger OpenAPI spec; it only surfaced
# against the live endpoint. Nothing in production was touched -- the 422
# is rejected before any change is applied. Fix: compose.prod.yaml stays
# versioned WITH its explanatory comments (most of the file), and the
# "Deploy project" step below strips comment/blank lines before sending --
# filtering, not shortening the committed file, keeps the comments where
# engineers read them while keeping the wire payload under the limit.
# tests/test_deploy_workflow.py pins both the filter and the 8192 ceiling
# against the real compose.prod.yaml so a file that grows too large fails a
# PR, not a live deploy.
on:
  workflow_run:
    workflows: [publish-images]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to (re)deploy; defaults to the current master commit"
        required: false
        type: string

# Nothing in this workflow needs to write to the repository -- it only
# reads compose.prod.yaml from the checkout and talks to the Hostinger API.
permissions:
  contents: read

# A fixed group serializes deploys so two never race against the same
# Hostinger project; `cancel-in-progress: false` because a deploy already in
# flight is mutating a live production project -- aborting it mid-rollout
# would leave the project in whatever partial state the last API call left
# it in, which is worse than letting it finish and queuing the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ADG_VPS_HOSTNAME: srv1994437.hstgr.cloud
  ADG_DOCKER_PROJECT: disclosure-gateway

jobs:
  deploy:
    # workflow_run fires for both a successful and a failed publish-images
    # run; only a successful one should trigger a deploy. workflow_dispatch
    # has no `conclusion` to check, so it is always allowed through.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://srv1994437.hstgr.cloud/disclosure-gateway
    steps:
      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.sha }}"
            if [ -z "$SHA" ]; then
              SHA="${{ github.sha }}"
            fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Checked out at the exact SHA being deployed, not whatever ref the
      # runner defaults to -- compose.prod.yaml must be read from the same
      # commit the images were built from, never a copy edited in place.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Resolve Hostinger VM id
        id: vm
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines")
          vm_id=$(echo "$response" | jq -r --arg host "$ADG_VPS_HOSTNAME" \
            '[.[] | select(.hostname == $host)] | if length == 1 then .[0].id else "" end')
          if [ -z "$vm_id" ]; then
            echo "::error::expected exactly one VM with hostname $ADG_VPS_HOSTNAME, found $(echo "$response" | jq '[.[] | select(.hostname == "'"$ADG_VPS_HOSTNAME"'")] | length')"
            exit 1
          fi
          echo "id=$vm_id" >> "$GITHUB_OUTPUT"

      - name: Deploy project (create/replace)
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          ADG_TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # ADG_PROVIDER=fake keeps the public demo on the deterministic,
          # credential-free provider. Switching to `anthropic` here would
          # also require ANTHROPIC_API_KEY and
          # ADG_PREVIEW_CONFIRMATION_SECRET in this environment payload,
          # both out of scope for this ticket.
          environment_body=$(printf 'ADG_IMAGE_TAG=%s\nADG_PROVIDER=fake\n' "$ADG_TARGET_SHA")
          # The Hostinger API rejects `content` over 8192 characters (see the
          # INCIDENT note in this file's header comment); compose.prod.yaml
          # itself stays versioned with its explanatory comments, so strip
          # comment/blank lines here -- semantics-preserving, pinned by
          # tests/test_deploy_workflow.py against a yaml.safe_load comparison
          # of the real file -- to build the payload that is actually sent.
          filtered_compose="$RUNNER_TEMP/compose.deploy.yaml"
          grep -vE '^[[:space:]]*(#|$)' compose.prod.yaml > "$filtered_compose"
          filtered_chars=$(wc -m < "$filtered_compose")
          if [ "$filtered_chars" -gt 8192 ]; then
            echo "::error::filtered compose.prod.yaml is $filtered_chars characters, over" \
              "the Hostinger API's 8192-character content limit -- trim compose.prod.yaml" \
              "(comments are already stripped before sending)"
            exit 1
          fi
          # jq --rawfile reads the filtered compose's raw bytes into the JSON
          # body -- never string-concatenation, which would silently break
          # on the file's own quoting/newlines and risk sending a mangled
          # compose file to a production project.
          payload=$(jq -n \
            --rawfile content "$filtered_compose" \
            --arg env "$environment_body" \
            --arg name "$ADG_DOCKER_PROJECT" \
            '{project_name: $name, content: $content, environment: $env}')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${{ steps.vm.outputs.id }}/docker"

      # The create call above only returns an async Action (id/name/state) --
      # it does NOT mean the new containers are already up. Poll the actual
      # container list until every container in the project is running the
      # SHA just deployed and reports healthy, then confirm from outside the
      # VPS too: the containers API can say "healthy" while nginx in front
      # of it is still misrouting, so a real request through the public URL
      # is the only check that reflects what an advisor would actually see.
      #
      # INCIDENT (run 35673821758, deploy of 1094b5be2cef99e97a020302772fb22c25bf9dcb):
      # the create/replace request above was accepted, but the very next
      # containers poll got HTTP 500. The old version of this step used
      # `curl --fail-with-body` under `set -euo pipefail`, so that single
      # transient 5xx made curl itself exit non-zero and aborted the whole
      # step immediately -- even though Hostinger was still recreating the
      # project and a re-run of the exact same SHA/workflow succeeded
      # seconds later with no code or image change. Issue #99: Hostinger's
      # containers endpoint can transiently return 5xx while a create/
      # replace action is still recreating the project, so this loop now
      # classifies the HTTP status explicitly instead of letting curl's own
      # failure decide, and treats that specific case as retryable:
      #   - 2xx: the only "normal" response. The body is parsed with jq; if
      #     it isn't valid JSON or isn't an array, that's a clear failure,
      #     not a silent retry (a malformed response is not a Hostinger
      #     recreation timing issue). The exact SHA+health predicate is
      #     unchanged from before.
      #   - 5xx: transient -- almost certainly Hostinger still tearing down
      #     or recreating the project -- logged (status + a bounded count,
      #     never the response body) and retried within the existing ~720s
      #     deadline at the existing ~15s interval.
      #   - 401/403: fail-fast. Retrying an authentication/authorization
      #     failure cannot resolve itself before the deadline.
      #   - any other status (other 4xx, unexpected 3xx, 1xx): fail-fast
      #     rather than silently retrying something that will never change.
      #   - a transport failure (curl exits non-zero with no HTTP response
      #     at all: DNS, connection refused, TLS, or the per-request
      #     --max-time cap below) is treated the same as "Hostinger not
      #     answering yet" and retried within the same deadline, counted
      #     separately from 5xx so the two are distinguishable in the
      #     timeout diagnostics. --max-time exists so a single hung request
      #     can't quietly consume the whole verification budget on its own.
      # Status/body/curl-exit-status are captured explicitly (via `-w`/`-o`
      # into a temp file) inside an `if status=$(curl ...); then ... else
      # ...; fi`, a construct `set -e` cannot kill on a non-2xx response --
      # unlike the plain, unguarded assignment the old version used.
      #
      # 720s IS THE BUDGET, NOT JUST A CONDITION CHECKED ONCE PER ITERATION:
      # one iteration can contain a containers curl, a ready curl, a root
      # curl and a sleep, each individually capped (30s/30s/30s/15s) --
      # checking the deadline only at the top of the loop let a single
      # iteration starting near the deadline overrun it by up to ~100s
      # while still reporting "timed out after 720s". `remaining_seconds`
      # recomputes what is actually left (clamped to >=0, never logged
      # negative) immediately before every one of those four operations;
      # `bounded_timeout`/`bounded_sleep_seconds` cap each operation at its
      # normal ceiling (30s / 15s) or whatever is actually left, whichever
      # is smaller, and the loop stops -- issuing no further request or
      # sleep -- the instant nothing is left. Concretely: each curl uses
      # `--max-time min(30, remaining)`; the ready and root curls share the
      # same deadline (remaining is recomputed between them, so a slow
      # ready call can leave root with little or no time, and root is then
      # simply not called if nothing is left); each sleep uses
      # `min(15, remaining)`. The HTTP status classification above is
      # unchanged by any of this.
      - name: Verify deployment
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          ADG_TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          containers_url="https://developers.hostinger.com/api/vps/v1/virtual-machines/${{ steps.vm.outputs.id }}/docker/${ADG_DOCKER_PROJECT}/containers"
          ready_url="https://${ADG_VPS_HOSTNAME}/disclosure-gateway/api/ready"
          root_url="https://${ADG_VPS_HOSTNAME}/disclosure-gateway"
          deadline=$((SECONDS + 720))
          have_valid_containers=0
          last_valid_containers="[]"
          last_containers_status=""
          last_ready_status=""
          last_root_status=""
          transient_5xx_count=0
          transport_failure_count=0

          # Seconds left before the shared 720s deadline, clamped to >=0 so
          # nothing downstream ever logs or computes a negative value.
          remaining_seconds() {
            local r=$((deadline - SECONDS))
            if [ "$r" -lt 0 ]; then
              r=0
            fi
            printf '%s\n' "$r"
          }

          # $1: remaining seconds (caller guarantees > 0) -> the --max-time
          # to actually use: the normal 30s ceiling, or less if the budget
          # itself has less than that left.
          bounded_timeout() {
            local r="$1"
            if [ "$r" -gt 30 ]; then
              r=30
            fi
            printf '%s\n' "$r"
          }

          # $1: remaining seconds (caller guarantees > 0) -> the sleep to
          # actually use: the normal 15s interval, or less if the budget
          # itself has less than that left.
          bounded_sleep_seconds() {
            local r="$1"
            if [ "$r" -gt 15 ]; then
              r=15
            fi
            printf '%s\n' "$r"
          }

          # ~15s poll interval, ~12min budget: the api image is ~2.6 GB to
          # pull and its healthcheck alone has a 120s start_period, on top
          # of whatever the old containers take to tear down first.
          while :; do
            remaining=$(remaining_seconds)
            if [ "$remaining" -le 0 ]; then
              break
            fi

            body_file=$(mktemp)
            status=""
            curl_rc=0
            if status=$(curl -sS --max-time "$(bounded_timeout "$remaining")" -o "$body_file" -w '%{http_code}' \
                -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
                "$containers_url"); then
              :
            else
              curl_rc=$?
            fi
            last_containers_status="$status"

            if [ "$curl_rc" -ne 0 ] || [ -z "$status" ] || [ "$status" = "000" ]; then
              transport_failure_count=$((transport_failure_count + 1))
              remaining=$(remaining_seconds)
              echo "Hostinger containers API unreachable (transport failure, curl exit ${curl_rc}) -- retrying (transport failures so far: ${transport_failure_count}, ~${remaining}s left)"
              rm -f "$body_file"
              if [ "$remaining" -le 0 ]; then
                break
              fi
              sleep "$(bounded_sleep_seconds "$remaining")"
              continue
            fi

            case "$status" in
              2??)
                if ! jq -e '.' "$body_file" >/dev/null 2>&1; then
                  echo "::error::Hostinger containers API returned HTTP ${status} with a response body that is not valid JSON"
                  rm -f "$body_file"
                  exit 1
                fi
                if ! jq -e 'type == "array"' "$body_file" >/dev/null 2>&1; then
                  echo "::error::Hostinger containers API returned HTTP ${status} with an unexpected JSON shape (expected an array of containers)"
                  rm -f "$body_file"
                  exit 1
                fi
                last_valid_containers=$(cat "$body_file")
                have_valid_containers=1
                rm -f "$body_file"
                if echo "$last_valid_containers" | jq -e --arg sha "$ADG_TARGET_SHA" \
                  '(length > 0) and all(.[]; (.image | endswith(":" + $sha)) and (.health == "healthy"))' \
                  >/dev/null 2>&1; then
                  remaining=$(remaining_seconds)
                  if [ "$remaining" -le 0 ]; then
                    break
                  fi
                  ready_status=$(curl -sS --max-time "$(bounded_timeout "$remaining")" -o /dev/null -w '%{http_code}' "$ready_url" || echo 000)
                  last_ready_status="$ready_status"

                  remaining=$(remaining_seconds)
                  if [ "$remaining" -le 0 ]; then
                    break
                  fi
                  root_status=$(curl -sS --max-time "$(bounded_timeout "$remaining")" -o /dev/null -w '%{http_code}' "$root_url" || echo 000)
                  last_root_status="$root_status"

                  if [ "$ready_status" = "200" ] && [ "$root_status" = "200" ]; then
                    echo "deployment verified: containers healthy at $ADG_TARGET_SHA, /disclosure-gateway/api/ready=200, /disclosure-gateway=200"
                    exit 0
                  fi
                  echo "containers healthy but public URL not yet 200 (ready=$ready_status, root=$root_status) -- retrying"
                fi
                ;;
              401|403)
                echo "::error::Hostinger containers API returned HTTP ${status}; authentication/authorization failure"
                rm -f "$body_file"
                exit 1
                ;;
              5??)
                transient_5xx_count=$((transient_5xx_count + 1))
                remaining=$(remaining_seconds)
                echo "Hostinger containers API returned HTTP ${status} during project replacement -- retrying (transient 5xx so far: ${transient_5xx_count}, ~${remaining}s left)"
                rm -f "$body_file"
                if [ "$remaining" -le 0 ]; then
                  break
                fi
                sleep "$(bounded_sleep_seconds "$remaining")"
                continue
                ;;
              *)
                echo "::error::Hostinger containers API returned unexpected HTTP ${status}"
                rm -f "$body_file"
                exit 1
                ;;
            esac

            remaining=$(remaining_seconds)
            if [ "$remaining" -le 0 ]; then
              break
            fi
            sleep "$(bounded_sleep_seconds "$remaining")"
          done

          echo "::error::deployment verification timed out after 720s"
          echo "last containers API HTTP status: ${last_containers_status:-none}"
          echo "transient 5xx responses: ${transient_5xx_count}"
          echo "transport failures: ${transport_failure_count}"
          case "$last_containers_status" in
            5??) echo "timed out after repeated Hostinger API 5xx responses" ;;
          esac
          if [ "$have_valid_containers" -eq 1 ]; then
            echo "$last_valid_containers" | jq -r '.[] | "name=\(.name) state=\(.state) health=\(.health) status=\(.status) image=\(.image)"'
            if [ -n "$last_ready_status" ] || [ -n "$last_root_status" ]; then
              echo "last public check statuses: ready=${last_ready_status:-none} root=${last_root_status:-none}"
            fi
          fi
          exit 1
