name: test

# CI is intentionally reserved for the canonical integration boundary.
# Feature/slice PRs target `develop` and are validated locally; only the
# final `develop -> master` PR (and pushes to master) consume GitHub Actions.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=adaptive_disclosure_gateway --cov-report=term-missing

  # The advisor-facing demo UI (T21 / issue #29). A separate job rather than
  # extra steps on `test` above: the two stacks share no toolchain, and a
  # Python failure and a UI failure should be distinguishable at a glance.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check basePath inlining (subpath deployment regression guard)
        # Regression guard for the production incident where every
        # client-side `/api/**` call went out with no `/disclosure-gateway`
        # prefix and 404'd at the domain root: `web/lib/basePath.ts`'s
        # `BASE_PATH` must resolve to a build-time literal in the CLIENT
        # bundle, which only a source-level check (this repo's Vitest suite,
        # run in Node) cannot observe. See
        # `web/scripts/check-basepath-inlined.mjs`'s module docstring.
        run: ADG_WEB_BASE_PATH=/disclosure-gateway npm run check:basepath
