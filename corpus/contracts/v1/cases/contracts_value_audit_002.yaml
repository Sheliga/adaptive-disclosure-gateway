input:
  sample_id: contracts_value_audit_002
  task_family: contract_value_audit
  text: |
    CONTRACT
    Contracting party: Arrecife Servicos Portuarios Ltda
    CNPJ: 66.777.888/0001-99
    Contracted party: Catavento Software Ltda
    Contract value: R$ 940000.00
    Deadline: 2026-11-30
    Spending-review reporting floor for this contract class: R$ 500000.00
  task: >-
    Report whether the contract value of this agreement is above the
    spending-review reporting floor stated for its contract class, giving
    the specific contract value figure. Do not identify either company.
  domain: contracts
  purpose: contract_summary
  requester_role: spending_reviewer
  policy_version: contracts-v1

oracle:
  sample_id: contracts_value_audit_002
  # The restricted half of the `purpose` dimension, and the case this family
  # exists for. The task explicitly asks for the specific figure, so B3 --
  # Task-aware, which reads only the task, has every reason to resolve
  # `contract_value` to PRESERVE. `contracts-v1` does not authorize PRESERVE
  # under `contract_summary`, so B4 -- Policy-governed resolves it to
  # GENERALIZE instead. GENERALIZE is the acceptable action: R$ 940000.00
  # bins to R$ 900000-950000, entirely above the R$ 500000.00 floor, so the
  # band still answers the question the case is scored on. This is a
  # governance restriction that costs the requester specificity and no
  # correctness.
  expected_spans:
    - category: party_name
      value: 'Arrecife Servicos Portuarios Ltda'
      start: 28
      end: 61
      task_necessity: not_required
      expected_actions: [remove, pseudonymize]
    - category: cnpj
      value: '66.777.888/0001-99'
      start: 68
      end: 86
      task_necessity: not_required
      expected_actions: [remove]
    - category: party_name
      value: 'Catavento Software Ltda'
      start: 105
      end: 128
      task_necessity: not_required
      expected_actions: [remove, pseudonymize]
    - category: contract_value
      value: 'R$ 940000.00'
      start: 145
      end: 157
      task_necessity: required
      expected_actions: [generalize]
    - category: deadline
      value: '2026-11-30'
      start: 168
      end: 178
      task_necessity: not_required
      expected_actions: [remove, generalize]
  expected_block_request: false
  expected_answer: >-
    The response reports that the contract value (R$ 940000.00) is above
    the spending-review reporting floor stated for this contract class (R$
    500000.00), and names neither company.
  answer_depends_on_categories: [contract_value]
  reconstruction:
    - category: party_name
      expected_reconstructable: true
