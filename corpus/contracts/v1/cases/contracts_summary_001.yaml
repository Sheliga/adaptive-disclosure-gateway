input:
  sample_id: contracts_summary_001
  task_family: contract_summary_without_identity
  text: |
    CONTRACT
    Contracting party: Meridiano Tecnologia Ltda
    CNPJ: 11.222.333/0001-44
    Contracted party: Corvina Infraestrutura SA
    CNPJ: 22.333.444/0001-55
    Contract value: R$ 2400000.00
    Deadline: 2026-03-31
    Approval threshold for this contract class: R$ 3000000.00
  task: >-
    Summarize the total value of this agreement against the approval
    threshold stated for its contract class. Do not identify either
    company or its registration number.
  domain: contracts
  purpose: contract_summary
  requester_role: contract_analyst
  policy_version: contracts-v1

oracle:
  sample_id: contracts_summary_001
  # The deadline is annotated not_required with [remove, generalize]: this
  # task asks only about the contract's total value against a stated
  # threshold, so transmitting an enforceable legal date serves nothing the
  # task needs. `contracts-v1` nonetheless resolves `deadline` to a hard
  # PRESERVE, deliberately more disclosing than B3 -- Task-aware would be on
  # its own (docs/contracts-policy-matrix.md). That divergence is the point
  # of annotating it honestly, not a reason to widen the acceptable set: it
  # is an identifiable B3->B4 cell in the under-studied direction, where
  # governance chooses enforceability over minimization.
  expected_spans:
    - category: party_name
      value: 'Meridiano Tecnologia Ltda'
      start: 28
      end: 53
      task_necessity: not_required
      expected_actions: [remove, pseudonymize]
    - category: cnpj
      value: '11.222.333/0001-44'
      start: 60
      end: 78
      task_necessity: not_required
      expected_actions: [remove]
    - category: party_name
      value: 'Corvina Infraestrutura SA'
      start: 97
      end: 122
      task_necessity: not_required
      expected_actions: [remove, pseudonymize]
    - category: cnpj
      value: '22.333.444/0001-55'
      start: 129
      end: 147
      task_necessity: not_required
      expected_actions: [remove]
    # With band_width=50000, R$ 2400000.00 bins to R$ 2400000-2450000, which
    # sits entirely below the R$ 3000000.00 threshold, so the band alone
    # answers the question and PRESERVE is unnecessary. `contracts-v1` does
    # not authorize PRESERVE for this purpose anyway -- only
    # `financial_audit` unlocks it.
    - category: contract_value
      value: 'R$ 2400000.00'
      start: 164
      end: 177
      task_necessity: required
      expected_actions: [generalize]
    - category: deadline
      value: '2026-03-31'
      start: 188
      end: 198
      task_necessity: not_required
      expected_actions: [remove, generalize]
  expected_block_request: false
  expected_answer: >-
    The response reports that the contract value (R$ 2400000.00) is below
    the approval threshold stated for this contract class (R$ 3000000.00),
    and names neither company nor either registration number.
  answer_depends_on_categories: [contract_value]
  reconstruction:
    - category: party_name
      expected_reconstructable: true
