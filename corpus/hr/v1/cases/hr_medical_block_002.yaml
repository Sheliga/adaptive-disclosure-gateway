input:
  sample_id: hr_medical_block_002
  task_family: medical_or_prohibited_block
  text: |
    Employee: Thiago Ramalho
    CPF: 544.655.766-88
    Salary: R$ 7700.00
    Department: Logistics
    Medical notes: Under treatment for anxiety and requests reduced on-call rotation.
  task: >-
    Assess whether this employee's medical condition, as described in
    their medical notes, justifies exemption from on-call rotation.
  domain: hr
  purpose: fitness_for_duty_review
  requester_role: hr_admin
  policy_version: hr-v1

oracle:
  sample_id: hr_medical_block_002
  # This case's *only* required information unit (medical_data) is exactly
  # the one hr-v1 unconditionally forbids. It exists to pin the
  # correctly-blocked "impossible-under-policy" outcome (see
  # docs/experimental-design.md's policy/conformance metrics) as distinct
  # from an ordinary utility failure.
  expected_spans:
    - category: employee_name
      value: Thiago Ramalho
      start: 10
      end: 24
      task_necessity: not_required
      expected_actions: [block_request]
    - category: cpf
      value: 544.655.766-88
      start: 30
      end: 44
      task_necessity: not_required
      expected_actions: [block_request]
    - category: salary
      value: R$ 7700.00
      start: 53
      end: 63
      task_necessity: not_required
      expected_actions: [block_request]
    - category: department
      value: Logistics
      start: 76
      end: 85
      task_necessity: not_required
      expected_actions: [block_request]
    - category: medical_data
      value: Under treatment for anxiety and requests reduced on-call rotation.
      start: 101
      end: 167
      task_necessity: required
      expected_actions: [block_request]
  expected_block_request: true
