input:
  sample_id: hr_team_summary_003
  task_family: team_summary_without_salary
  text: |
    Employee: Fernanda Prado
    CPF: 666.777.888-99
    Salary: R$ 6300.00
    Department: Legal
  task: >-
    Provide a one-sentence description of this employee's team for an
    internal directory entry. Salary and CPF must not be included.
  domain: hr
  purpose: team_summary
  requester_role: hr_viewer
  policy_version: hr-v1
  requested_pseudonym_scope: request
  request_id: req-hr-2003

oracle:
  sample_id: hr_team_summary_003
  expected_spans:
    - category: employee_name
      value: Fernanda Prado
      start: 10
      end: 24
      task_necessity: not_required
      expected_actions: [remove, pseudonymize]
    - category: cpf
      value: 666.777.888-99
      start: 30
      end: 44
      task_necessity: not_required
      expected_actions: [remove]
    - category: salary
      value: R$ 6300.00
      start: 53
      end: 63
      task_necessity: not_required
      expected_actions: [remove, generalize]
    - category: department
      value: Legal
      start: 76
      end: 81
      task_necessity: required
      expected_actions: [preserve]
  expected_block_request: false
  expected_answer: "The response identifies the employee's department as 'Legal'."
  answer_depends_on_categories: [department]
  reconstruction:
    - category: employee_name
      expected_reconstructable: true
