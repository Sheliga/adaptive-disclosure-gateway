version: hr-v1
domain: hr
pseudonym_scope:
  default: session
  role_max:
    hr_viewer: request
    hr_analyst: session
    hr_admin: organization
rules:
  employee_name:
    default: pseudonymize
  cpf:
    default: remove
  medical_data:
    default: block_request
  salary:
    default: task_dependent
    allowed_actions:
      - remove
      - generalize
    purpose_actions:
      salary_analysis:
        - remove
        - generalize
        - preserve
      compensation_review:
        - remove
        - generalize
        - preserve
  department:
    default: preserve
