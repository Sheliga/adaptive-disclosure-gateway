# Versioned record of the nginx server block actually running on the
# production host (srv1994437.hstgr.cloud, Hostinger VPS), as of the T25
# follow-up / hosted advisor URL work.
#
# THIS IS DOCUMENTATION, NOT AN APPLIED CONFIG: nothing in this repository
# copies this file onto the host automatically. It exists so the routing
# rules `compose.prod.yaml`, `web/next.config.ts`'s `ADG_WEB_BASE_PATH` and
# `docs/advisor-demo.md` all assume are recorded somewhere reviewable,
# instead of only living on the VPS itself. If the live config on the host
# changes, update this file to match -- do not let it drift into being a
# description of a config that no longer exists.
#
# The directives below (block order, block contents, values) are copied
# verbatim from `/etc/nginx/sites-available/default` on the host -- this is
# what the file is actually named there, not
# `sites-available/srv1994437.hstgr.cloud.conf` as an earlier version of
# this comment claimed. Only the surrounding prose comments (this header,
# the redirect-loop explanation below) are added on top; they are not on
# the host.
#
# Lines commented "# managed by Certbot" below are rewritten in place by
# `certbot renew` on every certificate renewal -- do not hand-edit them;
# certbot regenerates that exact block itself on each run. Everything else
# in this file is safe to hand-edit and is not touched by certbot.

server {
    server_name srv1994437.hstgr.cloud;

    # Uploaded documents (docs/advisor-demo.md's upload contract) can run up
    # to ADG_MAX_UPLOAD_BYTES (default 8 MiB) plus multipart overhead; 12M
    # gives headroom above that default without opening the door to an
    # unbounded body -- the application's own accepting boundary still
    # enforces the real limit.
    client_max_body_size 12M;

    # Static landing page at the domain root -- served directly by nginx,
    # not proxied anywhere.
    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Do NOT redirect the bare "/disclosure-gateway" path to a trailing
    # slash here. That was tried and produced an infinite redirect loop
    # (ERR_TOO_MANY_REDIRECTS) right after the first deploy:
    #
    #   /disclosure-gateway/  -> 308 -> /disclosure-gateway   (Next.js's own
    #                                    basePath normalization; trailingSlash
    #                                    defaults to false)
    #   /disclosure-gateway   -> 301 -> /disclosure-gateway/  (this nginx,
    #                                    when it used to `return 301` here)
    #
    # Next.js already normalizes basePath requests to its own canonical
    # form; nginx redirecting the other way fights that normalization
    # instead of agreeing with it. The fix is to stop rewriting the URL at
    # all and let both path shapes reach the app unchanged (below), not to
    # change Next's trailingSlash setting.
    location = /disclosure-gateway {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    # Reverse-proxies to the `web` service published by compose.prod.yaml as
    # 127.0.0.1:3000 -- loopback-only, so this nginx block is the only way
    # to reach it from outside the host.
    #
    # proxy_pass carries no URI part here (it ends at ":3000;", not
    # ":3000/disclosure-gateway/;") so nginx forwards the original request
    # URI verbatim instead of rewriting it -- rewriting it is what produced
    # the redirect loop described above.
    location /disclosure-gateway/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/srv1994437.hstgr.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/srv1994437.hstgr.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = srv1994437.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name srv1994437.hstgr.cloud;
    return 404; # managed by Certbot


}
