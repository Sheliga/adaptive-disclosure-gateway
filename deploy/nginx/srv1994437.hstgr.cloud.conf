# Versioned record of the nginx server block actually running on the
# production host (srv1994437.hstgr.cloud, Hostinger VPS), as of the T25
# follow-up / hosted advisor URL work.
#
# THIS IS DOCUMENTATION, NOT AN APPLIED CONFIG: nothing in this repository
# copies this file onto the host automatically. It exists so the routing
# rules `compose.prod.yaml`, `web/next.config.ts`'s `ADG_WEB_BASE_PATH` and
# `docs/advisor-demo.md` all assume are recorded somewhere reviewable,
# instead of only living on the VPS itself. If the live config on the host
# changes, update this file to match -- do not let it drift into being a
# description of a config that no longer exists.
#
# Layout on the host: /etc/nginx/sites-available/srv1994437.hstgr.cloud.conf,
# symlinked from /etc/nginx/sites-enabled/.
#
# Lines commented "# managed by Certbot" below are rewritten in place by
# `certbot renew` on every certificate renewal -- do not hand-edit them;
# certbot regenerates that exact block itself on each run. Everything else
# in this file is safe to hand-edit and is not touched by certbot.

server {
    listen 80;
    listen [::]:80;
    server_name srv1994437.hstgr.cloud;

    # managed by Certbot
    if ($host = srv1994437.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name srv1994437.hstgr.cloud;

    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/srv1994437.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1994437.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hand-maintained below this point -- not touched by certbot.

    # Uploaded documents (docs/advisor-demo.md's upload contract) can run up
    # to ADG_MAX_UPLOAD_BYTES (default 8 MiB) plus multipart overhead; 12M
    # gives headroom above that default without opening the door to an
    # unbounded body -- the application's own accepting boundary still
    # enforces the real limit.
    client_max_body_size 12M;

    # Static landing page at the domain root -- served directly by nginx,
    # not proxied anywhere.
    root /var/www/srv1994437.hstgr.cloud/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Next.js's basePath (ADG_WEB_BASE_PATH=/disclosure-gateway, baked into
    # the web image at build time -- see web/Dockerfile and
    # web/next.config.ts) requires the trailing slash on every request path
    # under it; a bare "/disclosure-gateway" request is redirected to the
    # canonical form before nginx ever proxies it, so every proxied request
    # both here and from the browser's own relative asset/API calls agrees
    # on one path shape.
    location = /disclosure-gateway {
        return 301 /disclosure-gateway/;
    }

    # Reverse-proxies to the `web` service published by compose.prod.yaml as
    # 127.0.0.1:3000 -- loopback-only, so this nginx block is the only way
    # to reach it from outside the host.
    location /disclosure-gateway/ {
        proxy_pass http://127.0.0.1:3000/disclosure-gateway/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js's own WebSocket/HMR upgrade path is a dev-only feature and
        # is not exercised by the production `next start` server this image
        # runs, but these two headers are the standard, harmless pairing
        # with proxy_http_version 1.1 and are kept for forward-compatibility
        # with any future feature that does need an upgraded connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
